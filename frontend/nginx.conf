upstream backend_service {
    server backend:8000;
}

server {
    listen 80;
    server_name 185.10.45.10;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name 185.10.45.10;

    ssl_certificate /home/berson/nginx/ssl/mysite.crt;  // cert.crt
    ssl_certificate_key /home/berson/nginx/ssl/mysite.key; // cert.key

    # SSL параметры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';

    # Настройки для React (фронтенд)
    location / {
        root /frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Настройки для Django (бэкенд)
    location /api/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Настройки для статических файлов Django
    location /static/ {
        alias /staticfiles/;
        autoindex on;
    }

    # Настройки для медиа-файлов Django
    location /media/ {
        alias /storage/;
        autoindex on;
    }
}
